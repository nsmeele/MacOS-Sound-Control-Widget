name: Release

# Push a tag such as v1.0.0 to build a DMG and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          xcodebuild \
            -project AudioSwitcher.xcodeproj \
            -scheme AudioSwitcher \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            build

      - name: Verify universal binary
        run: |
          app=build/Build/Products/Release/AudioSwitcher.app
          for bin in "$app/Contents/MacOS/AudioSwitcher" "$app"/Contents/PlugIns/*.appex/Contents/MacOS/*; do
            archs=$(lipo -archs "$bin")
            echo "$bin: $archs"
            [[ "$archs" == *x86_64* && "$archs" == *arm64* ]] || { echo "Not universal: $bin"; exit 1; }
          done

      - name: Package DMG
        run: |
          mkdir dmg
          ditto build/Build/Products/Release/AudioSwitcher.app "dmg/Sound Control.app"
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Sound Control" -srcfolder dmg -format UDZO "SoundControl-${GITHUB_REF_NAME}.dmg"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "SoundControl-${GITHUB_REF_NAME}.dmg" \
            --title "Sound Control ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md
