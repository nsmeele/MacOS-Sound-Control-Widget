name: CI

# Builds the app exactly like the release job does, so a broken release build
# or a missing architecture shows up on the pull request instead of after tagging.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build (universal)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          xcodebuild \
            -project AudioSwitcher.xcodeproj \
            -scheme AudioSwitcher \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            build

      - name: Verify universal binary
        run: |
          app=build/Build/Products/Release/AudioSwitcher.app
          for bin in "$app/Contents/MacOS/AudioSwitcher" "$app"/Contents/PlugIns/*.appex/Contents/MacOS/*; do
            archs=$(lipo -archs "$bin")
            echo "$bin: $archs"
            [[ "$archs" == *x86_64* && "$archs" == *arm64* ]] || { echo "Not universal: $bin"; exit 1; }
          done

      - name: Package DMG
        run: |
          mkdir dmg
          ditto build/Build/Products/Release/AudioSwitcher.app "dmg/Sound Control.app"
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Sound Control" -srcfolder dmg -format UDZO SoundControl.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: SoundControl-dmg
          path: SoundControl.dmg
          retention-days: 7
